# Starter CI workflow for Part E. Complete it so that:
#   - every push runs the smoke tests
#   - a scheduled nightly run executes the FULL suite (including slow tests)
# It must actually run on GitHub Actions (checked via your Actions tab).

name: tests

on:
  push:
  # TODO: add a scheduled nightly trigger (hint: 'schedule:' with a cron entry)

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pytest -m smoke
      # TODO: add a job (or step) that runs the full suite on the nightly schedule
